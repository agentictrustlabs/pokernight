# The card room's own contracts. Modelled on ~/agenticprimitives/packages/contracts/foundry.toml,
# but deliberately dependency-free: `lib/` is empty and `src/Sheqel.sol` imports nothing, so this
# project compiles from a clean checkout with no submodules and no npm install.
#
# The platform's contracts stay in the platform's repo. What lives here is the ONE thing that is
# the app's own: its currency.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 1000
