# pokernight-agent-worker — the poker personas. One Worker hosts all of them; which one answers is
# decided per request from the Host label (`sharkbot-svc.faithnet.ai`), a `?agent=` query param, or a
# leading path segment (`/sharkbot.svc/api/a2a`). See src/personas.ts.
#
# The BARE name below is for `wrangler dev` only. `pnpm run deploy` refuses without `WRANGLER_ENV=<env>`;
# never deploy this file without `--env` — that would publish a NEW Worker called
# `pokernight-agent-worker` instead of updating the live one.
#
# Secrets (NEVER in [vars]; see .dev.vars.example):
#   ANTHROPIC_API_KEY — for the `claude` strategy, which NO persona uses. The deployed Worker carries
#                       no such secret BY DECISION (deleted 2026-09-12): the house spends no tokens, and
#                       the only model in the card room is a connected person's own agent at their Home.
#                       Absent is fine by construction: a `claude` persona logs once and plays the rules.
name = "pokernight-agent-worker"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8788
local_protocol = "http"

# Vars are repeated per env on purpose (wrangler does not inherit vars into envs).
[vars]
AGENT_CARD_ZONE = "localhost"
PUBLIC_ORIGIN = "http://localhost:8788"
DEFAULT_STRATEGY = "rules"
LLM_MODEL = "claude-opus-5"
LLM_EFFORT = "low"

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# faithnet deployment universe (DESIGN.md §9). Worker name: pokernight-agent-worker-faithnet.
#
# The route is a WILDCARD, so every persona host lands here without a per-persona DNS record or a
# per-persona Worker. A wildcard route is `pattern` + `zone_name`; `custom_domain = true` is only for a
# single exact hostname and would be rejected for `*.faithnet.ai/*`.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
[env.faithnet]
name = "pokernight-agent-worker-faithnet"
# One dedicated host, NOT a wildcard on faithnet.ai: `*.faithnet.ai/*` is already claimed by the
# estate's demo-a2a worker, and a second claim would fight that deployment. Personas are selected
# by path here (`/sharkbot.svc/api/a2a`), which the resolver already supports.
routes = [{ pattern = "agents.faithnet.io", custom_domain = true }]

[env.faithnet.vars]
# ADMISSION (src/admission.ts): with these set, only the card room's house agent may drive a persona.
RPC_URL = "https://a2a.faithnet.io/rpc"
CHAIN_ID = "34348"
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
DELEGATION_MANAGER = "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
TIMESTAMP_ENFORCER = "0x73A7B878168b7DE48677617179A8bE894f0Dfe96"
ALLOWED_METHODS_ENFORCER = "0xdBb2E47793393C499efB0f3fcbf6Ca8669791a41"
HOUSE_SERVICE_SA = "0x0347e808a0bB7a7a7086a29d853E799f351C04DD"
AGENT_CARD_ZONE = "faithnet.ai"
PUBLIC_ORIGIN = "https://agents.faithnet.io"
DEFAULT_STRATEGY = "rules"
LLM_MODEL = "claude-opus-5"
LLM_EFFORT = "low"
