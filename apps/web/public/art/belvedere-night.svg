<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="The Hôtel Belvedere above the treeline on the night the pass shut: lit windows, falling snow, and the peaks behind it.">
  <title>Snowfall at the Belvedere</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#080D1C"/>
      <stop offset="0.38" stop-color="#132244"/>
      <stop offset="0.66" stop-color="#27406B"/>
      <stop offset="0.86" stop-color="#4E6A94"/>
      <stop offset="1"    stop-color="#7C93B4"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#EAF1FF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C6D7F2" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#C6D7F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8FA6C6"/>
      <stop offset="0.5" stop-color="#5B7398"/>
      <stop offset="1"   stop-color="#3B5177"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#6F87AC"/>
      <stop offset="0.6" stop-color="#36486B"/>
      <stop offset="1"   stop-color="#22314E"/>
    </linearGradient>
    <linearGradient id="snowGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#C9D8EC"/>
      <stop offset="0.35" stop-color="#9DB2CE"/>
      <stop offset="1"   stop-color="#5B7094"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3630"/>
      <stop offset="1" stop-color="#241F1B"/>
    </linearGradient>
    <linearGradient id="timber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4231"/>
      <stop offset="1" stop-color="#33241A"/>
    </linearGradient>
    <linearGradient id="roofSnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F8FF"/>
      <stop offset="1" stop-color="#BDCDE4"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFC978" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#F0A146" stop-opacity="0.28"/>
      <stop offset="1"   stop-color="#E08A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#05080F" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#05080F" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#05080F" stop-opacity="0"/>
      <stop offset="1"   stop-color="#05080F" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      /* Visible at rest and falling when motion is welcome: the flakes sit where they are drawn and the
         animation runs from a screen-height above, so a still render of this file still has snow in it. */
      @keyframes fall { from { transform: translateY(0); } to { transform: translateY(940px); } }
      @media (prefers-reduced-motion: no-preference) {
        .snowA { animation: fall 17s linear infinite; }
        .snowB { animation: fall 26s linear infinite; }
        .snowC { animation: fall 38s linear infinite; }
      }
      .flicker { animation: none; }
      @media (prefers-reduced-motion: no-preference) {
        @keyframes glow { 0%,100% { opacity: .9 } 45% { opacity: .66 } 70% { opacity: 1 } }
        .flicker { animation: glow 5.5s ease-in-out infinite; }
      }
    </style>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#E8F0FF">
    <circle cx="140" cy="88" r="1.7" opacity=".85"/><circle cx="268" cy="150" r="1.2" opacity=".6"/>
    <circle cx="392" cy="62" r="1.5" opacity=".75"/><circle cx="520" cy="126" r="1" opacity=".5"/>
    <circle cx="676" cy="70" r="1.8" opacity=".9"/><circle cx="812" cy="140" r="1.1" opacity=".55"/>
    <circle cx="960" cy="58" r="1.4" opacity=".7"/><circle cx="1104" cy="112" r="1.2" opacity=".6"/>
    <circle cx="1418" cy="76" r="1.6" opacity=".8"/><circle cx="1520" cy="168" r="1" opacity=".45"/>
    <circle cx="214" cy="232" r="1" opacity=".4"/><circle cx="1240" cy="206" r="1.3" opacity=".55"/>
  </g>
  <circle cx="1268" cy="168" r="210" fill="url(#moonGlow)"/>
  <circle cx="1268" cy="168" r="44" fill="#F2F6FF" opacity=".92"/>
  <circle cx="1252" cy="158" r="44" fill="#132244" opacity=".55"/>

  <!-- far range -->
  <path d="M-20 470 L150 300 L232 372 L352 214 L470 372 L560 300 L700 430 L820 336 L940 424 L1060 300
           L1180 418 L1300 330 L1420 430 L1620 320 L1620 520 L-20 520 Z" fill="url(#farPeak)" opacity=".55"/>
  <path d="M352 214 L318 262 L352 268 L386 258 Z" fill="#E6EEFC" opacity=".8"/>
  <path d="M1060 300 L1032 340 L1060 346 L1090 336 Z" fill="#E6EEFC" opacity=".7"/>
  <path d="M150 300 L124 342 L150 348 L178 338 Z" fill="#E6EEFC" opacity=".65"/>

  <!-- near range -->
  <path d="M-20 560 L120 400 L260 520 L420 350 L560 500 L720 400 L860 512 L1000 396 L1160 520
           L1320 420 L1460 530 L1620 440 L1620 700 L-20 700 Z" fill="url(#midPeak)"/>
  <path d="M420 350 L388 404 L420 412 L456 398 Z" fill="#DCE7F8" opacity=".85"/>
  <path d="M1000 396 L972 444 L1000 452 L1030 440 Z" fill="#DCE7F8" opacity=".75"/>
  <path d="M720 400 L694 446 L720 454 L748 442 Z" fill="#DCE7F8" opacity=".7"/>

  <!-- valley haze -->
  <rect x="-20" y="560" width="1640" height="150" fill="#22314E" opacity=".45" filter="url(#haze)"/>

  <!-- the ground the hotel stands on -->
  <path d="M-20 700 C 220 662, 520 648, 800 646 C 1090 644, 1380 660, 1620 700 L1620 920 L-20 920 Z" fill="url(#snowGround)"/>

  <!-- warm spill from the windows onto the snow -->
  <ellipse cx="800" cy="716" rx="340" ry="72" fill="url(#warm)" opacity=".5" filter="url(#soften)"/>

  <!-- ═══ the hotel ═══ -->
  <g>
    <!-- chimney smoke -->
    <path d="M939 346 C 968 304, 916 278, 952 234 C 990 188, 930 162, 972 116 C 1002 82, 968 62, 988 30"
          fill="none" stroke="#9FB4D2" stroke-opacity=".10" stroke-width="44" stroke-linecap="round"/>
    <path d="M939 346 C 964 308, 922 284, 954 242 C 986 200, 936 176, 972 132"
          fill="none" stroke="#C2D2E9" stroke-opacity=".09" stroke-width="22" stroke-linecap="round"/>

    <!-- left wing -->
    <rect x="522" y="524" width="150" height="132" fill="url(#stone)"/>
    <path d="M512 528 L597 452 L682 528 Z" fill="url(#timber)"/>
    <path d="M504 532 L597 448 L690 532 L676 542 L597 468 L518 542 Z" fill="url(#roofSnow)"/>

    <!-- main block -->
    <rect x="660" y="430" width="286" height="226" fill="url(#stone)"/>
    <rect x="660" y="430" width="286" height="12" fill="#4A443C"/>
    <!-- timber gable -->
    <path d="M648 436 L803 318 L958 436 Z" fill="url(#timber)"/>
    <path d="M636 442 L803 312 L970 442 L952 456 L803 334 L654 456 Z" fill="url(#roofSnow)"/>
    <!-- eaves snow along the block -->
    <rect x="652" y="428" width="302" height="10" rx="5" fill="url(#roofSnow)" opacity=".9"/>
    <!-- chimney -->
    <rect x="922" y="352" width="34" height="86" fill="#332B24"/>
    <rect x="918" y="346" width="42" height="12" rx="4" fill="url(#roofSnow)"/>

    <!-- right wing -->
    <rect x="934" y="506" width="140" height="150" fill="url(#stone)"/>
    <path d="M924 510 L1004 440 L1084 510 Z" fill="url(#timber)"/>
    <path d="M916 514 L1004 436 L1092 514 L1078 524 L1004 452 L930 524 Z" fill="url(#roofSnow)"/>

    <!-- lit windows: main block, three storeys -->
    <g class="flicker">
      <g fill="#FFCE86">
        <rect x="686" y="462" width="30" height="40" rx="3"/>
        <rect x="738" y="462" width="30" height="40" rx="3"/>
        <rect x="838" y="462" width="30" height="40" rx="3" opacity=".35"/>
        <rect x="890" y="462" width="30" height="40" rx="3"/>
        <rect x="686" y="528" width="30" height="40" rx="3" opacity=".4"/>
        <rect x="738" y="528" width="30" height="40" rx="3"/>
        <rect x="790" y="528" width="30" height="40" rx="3"/>
        <rect x="838" y="528" width="30" height="40" rx="3"/>
        <rect x="890" y="528" width="30" height="40" rx="3" opacity=".3"/>
      </g>
      <!-- the lounge: one long lit window at ground level, where everybody is -->
      <rect x="678" y="592" width="250" height="52" rx="4" fill="#FFD79A"/>
      <rect x="678" y="592" width="250" height="52" rx="4" fill="none" stroke="#7A5A33" stroke-width="3"/>
      <line x1="762" y1="592" x2="762" y2="644" stroke="#7A5A33" stroke-width="3"/>
      <line x1="844" y1="592" x2="844" y2="644" stroke="#7A5A33" stroke-width="3"/>
      <!-- wings -->
      <g fill="#FFCE86">
        <rect x="548" y="556" width="26" height="34" rx="3"/>
        <rect x="596" y="556" width="26" height="34" rx="3" opacity=".45"/>
        <rect x="548" y="606" width="26" height="34" rx="3" opacity=".6"/>
        <rect x="620" y="606" width="26" height="34" rx="3"/>
        <rect x="960" y="536" width="26" height="34" rx="3" opacity=".5"/>
        <rect x="1012" y="536" width="26" height="34" rx="3"/>
        <rect x="960" y="592" width="26" height="34" rx="3"/>
        <rect x="1012" y="592" width="26" height="34" rx="3" opacity=".4"/>
      </g>
    </g>

    <!-- porch and the two lanterns -->
    <rect x="770" y="612" width="66" height="46" fill="#2A231D"/>
    <path d="M756 616 L803 582 L850 616 Z" fill="url(#timber)"/>
    <path d="M750 620 L803 578 L856 620 L846 628 L803 592 L760 628 Z" fill="url(#roofSnow)"/>
    <rect x="788" y="624" width="30" height="34" rx="2" fill="#FFE2B0"/>
    <circle cx="758" cy="626" r="7" fill="#FFD27A"/>
    <circle cx="758" cy="626" r="20" fill="url(#warm)"/>
    <circle cx="848" cy="626" r="7" fill="#FFD27A"/>
    <circle cx="848" cy="626" r="20" fill="url(#warm)"/>
  </g>

  <!-- pines -->
  <g fill="#16233A">
    <path d="M120 700 L156 596 L192 700 Z"/><path d="M132 664 L156 606 L180 664 Z" fill="#1D2E48"/>
    <rect x="150" y="694" width="12" height="26"/>
    <path d="M232 712 L262 622 L292 712 Z"/><rect x="256" y="706" width="10" height="22"/>
    <path d="M330 706 L354 634 L378 706 Z" opacity=".85"/><rect x="349" y="700" width="9" height="20"/>
    <path d="M1236 704 L1272 600 L1308 704 Z"/><path d="M1248 668 L1272 610 L1296 668 Z" fill="#1D2E48"/>
    <rect x="1266" y="698" width="12" height="26"/>
    <path d="M1358 716 L1390 624 L1422 716 Z"/><rect x="1384" y="710" width="10" height="22"/>
    <path d="M1462 708 L1488 638 L1514 708 Z" opacity=".85"/><rect x="1481" y="702" width="9" height="20"/>
    <path d="M1060 706 L1086 640 L1112 706 Z" opacity=".7"/>
    <path d="M488 708 L512 644 L536 708 Z" opacity=".7"/>
  </g>

  <!-- drifts in front -->
  <path d="M-20 782 C 180 742, 420 768, 640 750 C 880 730, 1120 772, 1360 748 C 1470 738, 1560 754, 1620 764 L1620 920 L-20 920 Z"
        fill="#E2EBF8" opacity=".92"/>
  <path d="M-20 836 C 240 800, 520 830, 800 816 C 1080 802, 1360 838, 1620 818 L1620 920 L-20 920 Z"
        fill="#F4F8FF"/>

  <!-- the road up, and the shut pass -->
  <path d="M470 900 C 600 830, 690 792, 780 760 L830 760 C 740 800, 660 844, 580 900 Z" fill="#C9D8EC" opacity=".55"/>
  <!-- marker poles along the road, the way a pass road is marked when the snow takes the edges -->
  <g stroke="#2A3A56" stroke-width="4" stroke-linecap="round">
    <line x1="742" y1="778" x2="746" y2="752"/><line x1="686" y1="812" x2="690" y2="784"/>
    <line x1="618" y1="852" x2="622" y2="822"/><line x1="536" y1="898" x2="540" y2="864"/>
    <line x1="856" y1="776" x2="852" y2="750"/><line x1="912" y1="810" x2="908" y2="782"/>
  </g>
  <g fill="#E9411F" opacity=".75">
    <circle cx="746" cy="750" r="4"/><circle cx="690" cy="782" r="4"/><circle cx="622" cy="820" r="4"/>
    <circle cx="540" cy="862" r="4"/><circle cx="852" cy="748" r="4"/><circle cx="908" cy="780" r="4"/>
  </g>

  <!-- falling snow: two stacked copies per layer, so a layer is populated at every moment of the loop
       AND at rest — a still render of this file has snow in it, which a single scrolling copy would not. -->
  <defs>
    <g id="flakes-snowC" fill="#FFFFFF"><circle cx="90" cy="120" r="2"/><circle cx="300" cy="420" r="2.4"/><circle cx="520" cy="220" r="1.8"/>
      <circle cx="740" cy="520" r="2.2"/><circle cx="960" cy="300" r="2"/><circle cx="1180" cy="620" r="2.4"/>
      <circle cx="1400" cy="180" r="2"/><circle cx="200" cy="700" r="2.2"/><circle cx="1520" cy="440" r="1.8"/>
      <circle cx="640" cy="820" r="2"/><circle cx="1040" cy="760" r="2.2"/><circle cx="420" cy="900" r="1.9"/></g>
    <g id="flakes-snowB" fill="#FFFFFF"><circle cx="160" cy="260" r="3"/><circle cx="380" cy="60" r="2.6"/><circle cx="600" cy="640" r="3.2"/>
      <circle cx="820" cy="160" r="2.8"/><circle cx="1040" cy="500" r="3"/><circle cx="1260" cy="340" r="2.6"/>
      <circle cx="1480" cy="700" r="3.2"/><circle cx="60" cy="560" r="2.8"/><circle cx="900" cy="860" r="3"/>
      <circle cx="1340" cy="880" r="2.6"/><circle cx="500" cy="380" r="2.9"/><circle cx="1150" cy="80" r="2.7"/></g>
    <g id="flakes-snowA" fill="#FFFFFF"><circle cx="240" cy="180" r="4"/><circle cx="460" cy="540" r="4.6"/><circle cx="700" cy="300" r="4.2"/>
      <circle cx="920" cy="640" r="4.4"/><circle cx="1140" cy="220" r="4"/><circle cx="1360" cy="520" r="4.6"/>
      <circle cx="1560" cy="300" r="4"/><circle cx="120" cy="780" r="4.4"/><circle cx="780" cy="880" r="4.2"/>
      <circle cx="1020" cy="60" r="4"/><circle cx="340" cy="860" r="4.3"/><circle cx="1460" cy="900" r="4.1"/></g>
  </defs>
  <g class="snowC" opacity=".38"><use href="#flakes-snowC"/><use href="#flakes-snowC" y="-940"/></g>
  <g class="snowB" opacity=".6"><use href="#flakes-snowB"/><use href="#flakes-snowB" y="-940"/></g>
  <g class="snowA" opacity=".9"><use href="#flakes-snowA"/><use href="#flakes-snowA" y="-940"/></g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
</svg>
