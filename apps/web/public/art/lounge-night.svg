<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="The club room at night: a lit poker table under a low lamp, a fire burning at one end and the bar at the other.">
  <title>The club room</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1A1410"/>
      <stop offset="0.45" stop-color="#33241A"/>
      <stop offset="1"    stop-color="#45301F"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#5E3D28"/>
      <stop offset="0.5" stop-color="#7E5335"/>
      <stop offset="1"   stop-color="#9A663F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1D14"/>
      <stop offset="1" stop-color="#160F0A"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFD79B" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#F0A957" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#E08A2E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFB25A" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#E4732A" stop-opacity="0.28"/>
      <stop offset="1"   stop-color="#C64F18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="baize" cx="0.5" cy="0.38" r="0.68">
      <stop offset="0"   stop-color="#2E7A4F"/>
      <stop offset="0.6" stop-color="#1E5A39"/>
      <stop offset="1"   stop-color="#123B26"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A3F26"/>
      <stop offset="1" stop-color="#431F12"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4126"/>
      <stop offset="1" stop-color="#3A2314"/>
    </linearGradient>
    <linearGradient id="bottleLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE0A8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#C87A2E" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="stoneHearth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E5D4C"/>
      <stop offset="1" stop-color="#3B2E23"/>
    </linearGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0A0705" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#0A0705" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#0A0705" stop-opacity="0"/>
      <stop offset="1"   stop-color="#0A0705" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="vigSide" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0.6" stop-color="#0A0705" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0A0705" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        @keyframes lick { 0%,100% { transform: scaleY(1) } 30% { transform: scaleY(1.14) } 62% { transform: scaleY(.92) } }
        @keyframes emberGlow { 0%,100% { opacity: .85 } 40% { opacity: .6 } 72% { opacity: 1 } }
        .flame { transform-origin: 50% 100%; animation: lick 2.4s ease-in-out infinite; }
        .flame2 { transform-origin: 50% 100%; animation: lick 3.1s ease-in-out infinite reverse; }
        .hearthGlow { animation: emberGlow 4.4s ease-in-out infinite; }
      }
    </style>
  </defs>

  <!-- the room -->
  <rect width="1600" height="900" fill="url(#wall)"/>

  <!-- ceiling beams -->
  <g fill="url(#beam)">
    <rect x="-20" y="0" width="1640" height="54"/>
    <rect x="120" y="54" width="34" height="92" opacity=".85"/>
    <rect x="520" y="54" width="34" height="78" opacity=".7"/>
    <rect x="1040" y="54" width="34" height="78" opacity=".7"/>
    <rect x="1440" y="54" width="34" height="92" opacity=".85"/>
  </g>

  <!-- wainscot line -->
  <rect x="-20" y="470" width="1640" height="10" fill="#3B2A1D"/>
  <rect x="-20" y="480" width="1640" height="86" fill="#1C1410"/>

  <!-- floor -->
  <path d="M-20 566 L1620 566 L1620 920 L-20 920 Z" fill="url(#floor)"/>
  <g stroke="#3F2718" stroke-opacity=".38" stroke-width="2">
    <path d="M-20 620 L1620 620"/><path d="M-20 690 L1620 690"/><path d="M-20 776 L1620 776"/><path d="M-20 872 L1620 872"/>
  </g>
  <g stroke="#3F2718" stroke-opacity=".22" stroke-width="2">
    <path d="M140 566 L60 920"/><path d="M420 566 L380 920"/><path d="M700 566 L700 920"/>
    <path d="M980 566 L1020 920"/><path d="M1260 566 L1340 920"/>
  </g>

  <!-- ═══ the fire, at the left end ═══ -->
  <g>
    <ellipse cx="258" cy="600" rx="330" ry="220" fill="url(#fireGlow)" opacity=".55" class="hearthGlow"/>
    <rect x="132" y="300" width="252" height="270" fill="url(#stoneHearth)"/>
    <rect x="112" y="282" width="292" height="30" rx="4" fill="#6A5F56"/>
    <rect x="182" y="360" width="152" height="210" rx="6" fill="#100B08"/>
    <!-- logs -->
    <rect x="196" y="518" width="124" height="18" rx="9" fill="#3A241A"/>
    <rect x="210" y="498" width="96" height="16" rx="8" fill="#301D14"/>
    <!-- flame -->
    <path class="flame" d="M258 522 C 218 474, 240 432, 230 392 C 262 424, 280 406, 282 370 C 306 410, 320 462, 298 502 C 288 518, 274 526, 258 522 Z" fill="#F0862A"/>
    <path class="flame" d="M256 520 C 228 482, 244 450, 238 418 C 262 444, 276 430, 278 402 C 296 434, 304 474, 288 500 Z" fill="#F9A83E"/>
    <path class="flame2" d="M256 516 C 240 490, 250 464, 248 442 C 264 462, 272 452, 274 434 C 286 458, 290 490, 278 508 Z" fill="#FFDE8C"/>
    <ellipse cx="258" cy="544" rx="96" ry="20" fill="#FF9A3C" opacity=".5" filter="url(#soft)"/>
    <ellipse cx="258" cy="452" rx="120" ry="130" fill="url(#fireGlow)" opacity=".55"/>
    <!-- mantel things -->
    <rect x="152" y="258" width="14" height="26" fill="#2A2019"/>
    <rect x="352" y="252" width="16" height="32" fill="#2A2019"/>
    <!-- two chairs by it -->
    <path d="M62 636 L62 540 Q62 522 82 522 L138 522 Q158 522 158 540 L158 636 Z" fill="#4A2E20"/>
    <rect x="52" y="628" width="118" height="26" rx="8" fill="#5C3A28"/>
    <path d="M392 640 L392 548 Q392 530 412 530 L462 530 Q482 530 482 548 L482 640 Z" fill="#43291C"/>
    <rect x="382" y="632" width="110" height="24" rx="8" fill="#543422"/>
    <ellipse cx="272" cy="684" rx="268" ry="48" fill="#8E3626" opacity=".55"/>
    <ellipse cx="272" cy="684" rx="214" ry="34" fill="#A8462F" opacity=".45"/>
  </g>

  <!-- ═══ the bar, at the right end ═══ -->
  <g>
    <!-- back-bar shelves, lit from within -->
    <rect x="1124" y="300" width="416" height="252" fill="#191009"/>
    <rect x="1124" y="300" width="416" height="252" fill="url(#lampGlow)" opacity=".5"/>
    <g fill="#2A1B11">
      <rect x="1124" y="372" width="416" height="9"/>
      <rect x="1124" y="446" width="416" height="9"/>
    </g>
    <g fill="url(#bottleLight)">
      <rect x="1152" y="326" width="17" height="46" rx="5"/><rect x="1182" y="334" width="14" height="38" rx="4"/>
      <rect x="1210" y="320" width="19" height="52" rx="6"/><rect x="1246" y="336" width="15" height="36" rx="4"/>
      <rect x="1278" y="324" width="17" height="48" rx="5"/><rect x="1312" y="338" width="14" height="34" rx="4"/>
      <rect x="1346" y="322" width="18" height="50" rx="5"/><rect x="1382" y="334" width="15" height="38" rx="4"/>
      <rect x="1414" y="328" width="17" height="44" rx="5"/><rect x="1450" y="336" width="14" height="36" rx="4"/>
      <rect x="1484" y="324" width="18" height="48" rx="5"/>
      <rect x="1158" y="404" width="16" height="42" rx="5" opacity=".8"/><rect x="1192" y="412" width="14" height="34" rx="4" opacity=".7"/>
      <rect x="1226" y="402" width="17" height="44" rx="5" opacity=".85"/><rect x="1262" y="414" width="14" height="32" rx="4" opacity=".6"/>
      <rect x="1296" y="406" width="16" height="40" rx="5" opacity=".8"/><rect x="1332" y="412" width="14" height="34" rx="4" opacity=".7"/>
      <rect x="1368" y="404" width="17" height="42" rx="5" opacity=".85"/><rect x="1404" y="414" width="14" height="32" rx="4" opacity=".6"/>
      <rect x="1440" y="406" width="16" height="40" rx="5" opacity=".75"/><rect x="1476" y="412" width="15" height="34" rx="4" opacity=".65"/>
    </g>
    <!-- the counter -->
    <path d="M1078 566 L1620 566 L1620 608 L1078 608 Z" fill="url(#barTop)"/>
    <path d="M1078 566 L1620 566 L1620 578 L1078 578 Z" fill="#B0763F"/>
    <path d="M1078 578 L1620 578 L1620 583 L1078 583 Z" fill="#E2B071" opacity=".75"/>
    <rect x="1096" y="604" width="524" height="126" fill="#251710"/>
    <g stroke="#3C2617" stroke-width="3">
      <path d="M1200 604 L1200 730"/><path d="M1330 604 L1330 730"/><path d="M1460 604 L1460 730"/>
    </g>
    <!-- stools -->
    <g fill="#4A2F1C">
      <ellipse cx="1146" cy="648" rx="34" ry="12"/><rect x="1140" y="652" width="12" height="82"/>
      <rect x="1120" y="730" width="52" height="9" rx="4"/>
      <ellipse cx="1262" cy="656" rx="34" ry="12"/><rect x="1256" y="660" width="12" height="78"/>
      <rect x="1236" y="734" width="52" height="9" rx="4"/>
      <ellipse cx="1378" cy="650" rx="32" ry="11" opacity=".85"/><rect x="1372" y="654" width="11" height="80" opacity=".85"/>
    </g>
    <ellipse cx="1330" cy="640" rx="330" ry="130" fill="url(#lampGlow)" opacity=".28"/>
  </g>

  <!-- ═══ the table ═══ -->
  <g>
    <!-- the low lamp over it -->
    <rect x="794" y="0" width="8" height="150" fill="#1A120C"/>
    <path d="M706 150 L890 150 L858 206 L738 206 Z" fill="#2E1D12"/>
    <path d="M738 206 L858 206 L852 214 L744 214 Z" fill="#FFCE86"/>
    <ellipse cx="798" cy="470" rx="440" ry="320" fill="url(#lampGlow)"/>

    <!-- the felt -->
    <ellipse cx="798" cy="660" rx="392" ry="150" fill="url(#rail)"/>
    <ellipse cx="798" cy="650" rx="392" ry="150" fill="#8A4A2C"/>
    <ellipse cx="798" cy="648" rx="352" ry="126" fill="url(#baize)"/>
    <ellipse cx="798" cy="642" rx="352" ry="126" fill="none" stroke="#0E3020" stroke-width="3" opacity=".6"/>

    <!-- the board: three up, two to come -->
    <g>
      <g transform="translate(646 600) rotate(-3)"><rect width="56" height="80" rx="6" fill="#FAF6EE"/><text x="10" y="32" font-family="Georgia,serif" font-size="30" fill="#17171A">A</text><text x="30" y="66" font-family="Georgia,serif" font-size="30" fill="#17171A">♠</text></g>
      <g transform="translate(712 596)"><rect width="56" height="80" rx="6" fill="#FAF6EE"/><text x="10" y="32" font-family="Georgia,serif" font-size="30" fill="#B3182A">K</text><text x="30" y="66" font-family="Georgia,serif" font-size="30" fill="#B3182A">♥</text></g>
      <g transform="translate(778 598) rotate(2)"><rect width="56" height="80" rx="6" fill="#FAF6EE"/><text x="12" y="32" font-family="Georgia,serif" font-size="30" fill="#17171A">9</text><text x="30" y="66" font-family="Georgia,serif" font-size="30" fill="#17171A">♣</text></g>
      <g transform="translate(844 600)"><rect width="56" height="80" rx="6" fill="#6E2018"/><rect x="6" y="6" width="44" height="68" rx="4" fill="none" stroke="#C98B72" stroke-width="2"/></g>
      <g transform="translate(910 602) rotate(-2)"><rect width="56" height="80" rx="6" fill="#6E2018"/><rect x="6" y="6" width="44" height="68" rx="4" fill="none" stroke="#C98B72" stroke-width="2"/></g>
    </g>

    <!-- chips: a pot in the middle and a stack at the near rail -->
    <g>
      <g transform="translate(560 690)">
        <ellipse cx="0" cy="28" rx="34" ry="11" fill="#1A1A1E" opacity=".45"/>
        <g fill="#C9302C"><ellipse cx="0" cy="22" rx="30" ry="10"/><ellipse cx="0" cy="14" rx="30" ry="10"/><ellipse cx="0" cy="6" rx="30" ry="10"/></g>
        <g fill="#E8544F"><ellipse cx="0" cy="-2" rx="30" ry="10"/></g>
      </g>
      <g transform="translate(1024 684)">
        <ellipse cx="0" cy="30" rx="32" ry="11" fill="#1A1A1E" opacity=".45"/>
        <g fill="#1F4E79"><ellipse cx="0" cy="24" rx="28" ry="9"/><ellipse cx="0" cy="16" rx="28" ry="9"/></g>
        <g fill="#2F6FA8"><ellipse cx="0" cy="8" rx="28" ry="9"/></g>
      </g>
      <g transform="translate(798 706)">
        <ellipse cx="0" cy="18" rx="88" ry="24" fill="#123B26" opacity=".7"/>
        <g fill="#E4E0D6"><ellipse cx="-34" cy="10" rx="26" ry="9"/><ellipse cx="-34" cy="3" rx="26" ry="9"/></g>
        <g fill="#C9302C"><ellipse cx="6" cy="12" rx="26" ry="9"/><ellipse cx="6" cy="5" rx="26" ry="9"/><ellipse cx="6" cy="-2" rx="26" ry="9"/></g>
        <g fill="#2B2B30"><ellipse cx="46" cy="10" rx="26" ry="9"/><ellipse cx="46" cy="3" rx="26" ry="9"/></g>
      </g>
    </g>

    <!-- two people at the far rail, and one at the bar. A room with nobody in it is a showroom. -->
    <g fill="#140D08">
      <g transform="translate(560 430)"><circle cx="0" cy="0" r="27"/><path d="M-44 108 Q-44 40 0 40 Q44 40 44 108 Z"/></g>
      <g transform="translate(1036 436)"><circle cx="0" cy="0" r="26"/><path d="M-42 106 Q-42 40 0 40 Q42 40 42 106 Z"/></g>
    </g>
    <g fill="#180F09" opacity=".92">
      <g transform="translate(1206 474)"><circle cx="0" cy="0" r="24"/><path d="M-38 120 Q-38 38 0 38 Q38 38 38 120 Z"/></g>
    </g>
    <!-- chairs around the far rail, in silhouette -->
    <g fill="#1B120C">
      <path d="M520 556 L520 486 Q520 472 536 472 L584 472 Q600 472 600 486 L600 556 Z" opacity=".95"/>
      <path d="M758 544 L758 470 Q758 456 774 456 L824 456 Q840 456 840 470 L840 544 Z" opacity=".95"/>
      <path d="M996 556 L996 486 Q996 472 1012 472 L1060 472 Q1076 472 1076 486 L1076 556 Z" opacity=".95"/>
    </g>
  </g>

  <!-- the near chair back, so the viewer is AT the table rather than looking at it -->
  <path d="M470 920 L470 812 Q470 790 500 790 L1096 790 Q1126 790 1126 812 L1126 920 Z" fill="#1B120B"/>
  <path d="M470 812 Q470 790 500 790 L1096 790 Q1126 790 1126 812 L1126 824 L470 824 Z" fill="#3A2415"/>
  <path d="M470 812 Q470 790 500 790 L1096 790 Q1126 790 1126 812 L1126 816 L470 816 Z" fill="#6B4527" opacity=".7"/>

  <rect width="1600" height="900" fill="url(#vigSide)"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#grain2)" opacity=".055" style="mix-blend-mode:overlay"/>
</svg>
