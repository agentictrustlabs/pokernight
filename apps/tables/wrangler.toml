# pokernight-tables — the table service: one PokerTableDO per table (hibernatable WebSockets, SQLite,
# alarms) plus a LobbyDO that lists and creates tables.
#
# The BARE name below is for `wrangler dev` only. `pnpm run deploy` refuses without `WRANGLER_ENV=<env>`;
# never deploy this file without `--env` — that would publish a NEW Worker called `pokernight-tables`
# instead of updating the live one. A second deployment universe is another `[env.<name>]` block.
#
# Bindings and vars are repeated per env on purpose (wrangler does not inherit vars / DO bindings into envs).
#   TABLES   — PokerTableDO namespace (one instance per table id)
#   LOBBIES  — LobbyDO namespace (one instance per circle; "default" in phase 1)
#   SESSIONS — SessionDO namespace (one instance per playerId; the server-side half of a Home session)
#
# Secrets (NEVER in [vars]; see .dev.vars.example):
#   SESSION_SECRET      — HMAC key for session tokens (`wrangler secret put SESSION_SECRET --env <env>`)
#   OPERATOR_TOKEN      — operator authority for DELETE /tables/:id/seat/:seat and DELETE
#                         /tables/:id, presented in the x-operator-token header and compared in
#                         constant time. There is no admin role in this app; this secret is the whole
#                         of it. A deployment that has not set it can clear no seats and retire no
#                         tables at all, which is the safe default.
#                         `wrangler secret put OPERATOR_TOKEN --env <env>`. Never a var, never logged.
#   RPC_TOKEN           — chain-rpc-gateway app token for the tables Worker (phase 3)
#   HOUSE_CUSTODIAN_KEY — private key custodying HOUSE_SERVICE_SA and HOUSE_TREASURY_SA. It only
#                         ever SIGNS userOpHashes; it never holds the asset. Provisioned into
#                         .house-key.json by scripts/provision-house.mts and set with
#                         `wrangler secret put HOUSE_CUSTODIAN_KEY --env <env>`.
name = "pokernight-tables"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
local_protocol = "http"

[durable_objects]
bindings = [
  { name = "TABLES", class_name = "PokerTableDO" },
  { name = "LOBBIES", class_name = "LobbyDO" },
  { name = "SESSIONS", class_name = "SessionDO" },
  { name = "MISSIONS", class_name = "MissionRegistryDO" },
  { name = "ROOMS", class_name = "SceneDO" },
]

# Migration history is shared across envs and is applied to live Workers. Migration tags must NEVER be
# renamed or reordered; add a new tag for every schema/class change.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerTableDO", "LobbyDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SessionDO"]

# Clubs (docs/WORKSPACES.md). v3 gave a club a roster object and a player a club index; v4 takes both away
# again: a club is its workspace agent at the Home and the card room keeps nothing of it but the wire it
# was handed (`src/clubs.ts`, KV `CLUB_WIRES`).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["ClubDO", "ClubIndexDO"]

[[migrations]]
tag = "v4"
deleted_classes = ["ClubDO", "ClubIndexDO"]

# THE MISSION REGISTRY's operator store (docs/MISSION-REGISTRY.md §2): entries, receipts, the log.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["MissionRegistryDO"]

# THE ROOM (docs/SPATIAL-ROOM.md): presence, one object per room.
[[migrations]]
tag = "v6"
new_sqlite_classes = ["SceneDO"]

[[kv_namespaces]]
binding = "CLUB_WIRES"
id = "e8fd7d1531324551a74655bb622dab58"

# Rate limits (Workers Rate Limiting). Per session on the routes that cost a Home round-trip; per IP on sign-in.
[[unsafe.bindings]]
name = "RL_SESSION"
type = "ratelimit"
namespace_id = "3101"
simple = { limit = 60, period = 10 }

[[unsafe.bindings]]
name = "RL_AUTH"
type = "ratelimit"
namespace_id = "3102"
simple = { limit = 20, period = 60 }

# Local dev (Anvil on :8545, Vite on :5173). There is no dev login: sign in through a Home.
[vars]
CHAIN_ID = "31337"
RPC_URL = "http://127.0.0.1:8545"
# Local dev points agents at localhost:8788; a public deployment must NOT enable this.
ALLOW_AGENT_ENDPOINT = "true"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
# Asset base units per chip for tables opened FROM NOW ON. 1000000 = 1 Sheqel per chip at 6 decimals,
# so a 1/2 table with a 40-200 buy-in reads as a normal cash game. Every existing table
# keeps the rate stamped on it when it was created (PokerTableDO `meta.chipValue`); changing this
# opens new tables at a new rate and re-values nothing.
CHIP_VALUE = "1000000"
# The rate tables created BEFORE the rate was pinned have been settling at, and the value stamped
# onto such a table the first time it loads. It exists so that raising CHIP_VALUE above cannot
# re-value stacks already sitting on an open table — the deploy that adds pinning is the same deploy
# that raises the default, so "today's default" would be the wrong answer for every existing table.
# Delete it once every live table has loaded once; it is not a default for anything new.
LEGACY_CHIP_VALUE = "10000"
# The settlement asset for tables opened FROM NOW ON, and what it calls itself. Local dev has no
# chain of its own worth naming; these are here so the shape is identical in both universes and so
# the unit tests can exercise pinning and migration. Like CHIP_VALUE, this is read ONCE per table,
# at creation, and stamped on it — never at settlement time.
ASSET = "0x1111111111111111111111111111111111111111"
ASSET_SYMBOL = "SHQ"
# Home sign-in (OIDC). The ONLY registered redirect_uri for client `pokernight` is
# https://poker.faithnet.io/ — there is no localhost redirect, so the real ceremony CANNOT run
# against the live Home from `wrangler dev`. Local dev signs in through POST /dev/session instead.
# These values keep the config shape identical in both universes and let the unit tests exercise the
# server half against a stubbed Home on localhost.
HOME_ORIGIN = "http://localhost:3000"
HOME_ZONE = "localhost"
HOME_CLIENT_ID = "pokernight"
HOME_DELEGATE = "0x89d13c596c45e4ee80af5ae06c727fe9a820ffd0"
HOME_REDIRECT_URI = "http://localhost:5173/"
# Agent seats: `agentName` resolves to `<label>.<AGENT_CARD_ZONE>` (http under a localhost zone,
# https otherwise). In local dev seat an agent with an explicit `endpoint` instead, e.g. the agent
# worker on http://localhost:8788/?agent=sharkbot.svc.
AGENT_CARD_ZONE = "localhost"
# Wall clock for one A2A request (agent card fetch, poker.act turn). The turn clock bounds it further.
A2A_TIMEOUT_MS = "20000"
# How long a seat must have been SILENT before an operator may clear it — the fourth condition on
# DELETE /tables/:id/seat/:seat. Five minutes: long enough that a player who stepped away from the
# keyboard cannot be cleared out from under their chips, short enough that a table silted up with
# abandoned seats is recoverable the same evening. Lower it in local dev to exercise the route.
SEAT_IDLE_MS = "300000"

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# faithnet deployment universe (DESIGN.md §9). Worker name: pokernight-tables-faithnet.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
[env.faithnet]
name = "pokernight-tables-faithnet"
# games.faithnet.io since 2026-09-14; tables.faithnet.io stays bound (the sockets and the ICS links
# people already hold) and answers the same Worker.
routes = [
  { pattern = "games.faithnet.io", custom_domain = true },
  { pattern = "tables.faithnet.io", custom_domain = true },
]

[env.faithnet.durable_objects]
bindings = [
  { name = "TABLES", class_name = "PokerTableDO" },
  { name = "LOBBIES", class_name = "LobbyDO" },
  { name = "SESSIONS", class_name = "SessionDO" },
  { name = "MISSIONS", class_name = "MissionRegistryDO" },
  { name = "ROOMS", class_name = "SceneDO" },
]

[[env.faithnet.migrations]]
tag = "v1"
new_sqlite_classes = ["PokerTableDO", "LobbyDO"]

[[env.faithnet.migrations]]
tag = "v2"
new_sqlite_classes = ["SessionDO"]

[[env.faithnet.migrations]]
tag = "v3"
new_sqlite_classes = ["ClubDO", "ClubIndexDO"]

# A club is its workspace agent at the Home; the card room keeps nothing of it but the wire (KV CLUB_WIRES).
[[env.faithnet.migrations]]
tag = "v4"
deleted_classes = ["ClubDO", "ClubIndexDO"]

[[env.faithnet.migrations]]
tag = "v5"
new_sqlite_classes = ["MissionRegistryDO"]

[[env.faithnet.migrations]]
tag = "v6"
new_sqlite_classes = ["SceneDO"]

[[env.faithnet.kv_namespaces]]
binding = "CLUB_WIRES"
id = "e8fd7d1531324551a74655bb622dab58"

[[env.faithnet.unsafe.bindings]]
name = "RL_SESSION"
type = "ratelimit"
namespace_id = "3101"
simple = { limit = 60, period = 10 }

[[env.faithnet.unsafe.bindings]]
name = "RL_AUTH"
type = "ratelimit"
namespace_id = "3102"
simple = { limit = 20, period = 60 }

[env.faithnet.vars]
# Coach SERVICES for hire (each a Smart Agent somebody custodies, advertising poker.advise). The hiring is
# a ceremony at the person's Home; HOME_COACH_TEMPLATE names it once the Home supports it (unset ⇒ not offered).
COACH_SERVICES = "bob-coach.svc,carol-coach.svc"
# The Home's A2A worker: a club's own agent is asked there under the club's wire (`clubs.ts`), and its huddle
# service under the paired CLUB_ROSTER_SECRET (spec 378).
HOME_A2A_ORIGIN = "https://a2a.faithnet.io"
# Where `atl:capabilities` lives — what an agent ANSWERS, read beside its served card (a release is a snapshot).
AGENT_PROFILE_RESOLVER = "0xB03F7C06ad3274F584AB72794406D639c02A45e1"
CHAIN_ID = "34348"
# rpc.faithnet.io requires a chain-rpc-gateway app token (RPC_TOKEN, a secret). The browser-safe a2a
# relay below needs none and is what scripts/provision-house.mts uses; swap once RPC_TOKEN is set.
RPC_URL = "https://a2a.faithnet.io/rpc"
HOME_ORIGIN = "https://www.faithnet.me"
HOME_ZONE = "faithnet.me"
# OIDC client registered at the Home (GET https://www.faithnet.me/connect/client-info?client_id=pokernight):
# redirect_uris ["https://gamenight.faithnet.io/"], scopes "openid agent" (NOT profile),
# delegation templates site-login / org-create. HOME_DELEGATE is the delegate the Home scopes its
# grant to; it must match the registration or the Home refuses the authorize request.
HOME_CLIENT_ID = "pokernight"
HOME_DELEGATE = "0x89d13c596c45e4ee80af5ae06c727fe9a820ffd0"
# Byte-identical to the registered redirect_uri, at authorize AND at /token.
HOME_REDIRECT_URI = "https://gamenight.faithnet.io/"
# `sharkbot.svc` → https://sharkbot-svc.faithnet.ai (DESIGN.md §4).
AGENT_CARD_ZONE = "faithnet.ai"
# Poker personas are served from one host, selected by path. Overrides host-per-agent resolution.
AGENT_BASE_URL = "https://agents.faithnet.io"
A2A_TIMEOUT_MS = "20000"
# See the dev block above. Five minutes of silence before an abandoned seat may be cleared.
SEAT_IDLE_MS = "300000"
# The estate's UniversalSignatureValidator — a club's wire is checked against the club's own account with it.
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
# THE MISSION REGISTRY (docs/MISSION-REGISTRY.md): the operator agent the house custodies (house.faithchain.json)
# and the estate's AgentRegistryBase. The operator's wire is the secret MISSIONS_REGISTRY_WIRE.
MISSIONS_REGISTRY_SA = "0x1cfD1174167f4e946d016E86E7d58C5e601c74C0"
AGENT_REGISTRY_BASE = "0x0Be172F1b5cfD1d084CEc2cF2Af0A0cE9023Deb1"
ALLOWED_ORIGINS = "https://gamenight.faithnet.io,https://poker.faithnet.io"
# 1 chip = 1.000000 Sheqel for tables opened from now on. Tables opened before this line changed keep
# the 0.01 chip they were created with — the rate is pinned per table, never re-read from here
# (see PokerTableDO `meta.chipValue` and apps/tables/test/chip-value.test.ts).
CHIP_VALUE = "1000000"
# The rate tables created BEFORE the rate was pinned have been settling at, and the value stamped
# onto such a table the first time it loads. It exists so that raising CHIP_VALUE above cannot
# re-value stacks already sitting on an open table — the deploy that adds pinning is the same deploy
# that raises the default, so "today's default" would be the wrong answer for every existing table.
# Delete it once every live table has loaded once; it is not a default for anything new.
LEGACY_CHIP_VALUE = "10000"
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# The card room's own money.
#
# Sheqel (SHQ) — `contracts/src/Sheqel.sol`, deployed to faithchain by `pnpm deploy:sheqel`, 6
# decimals to match every other amount in this app, open mint because it is a TEST asset and the
# house seeds new players. The address also lives in house.faithchain.json.
#
# It is the ONLY currency this card room settles in. There is no second asset, no conversion and no
# fallback: a table that cannot be opened in Sheqel is not opened.
#
# Still stamped per table at creation (`PokerTableDO` meta.asset), exactly as CHIP_VALUE is. With one
# currency the stamp can never disagree with this line — which is why it is cheap, and why it is
# kept: it makes "which coin does this table settle in?" a question about the table's own data rather
# than about whatever this variable is pointed at today.
ASSET = "0xa14E4a9447607c1233DcE34dB6Ead47C094f6141"
ASSET_SYMBOL = "SHQ"
# Contract addresses (phase 3): copy from @agenticprimitives/contracts (deployments/faithchain)
# (keys: entryPoint, agentAccountFactory, delegationManager, paymentEnforcer, digestBindingEnforcer,
# paymentReceiptRegistry). HOUSE_SA / HOUSE_DELEGATE come from the pokernight.treasury Smart Agent
# provisioned as an operator prerequisite (DESIGN.md §10).
ENTRY_POINT = "0xf7855250B3363AB7649B10957d8908A9AFcdD4B5"
AGENT_ACCOUNT_FACTORY = "0x464eEe7518c3c97DA570592481329E0627E9a3B8"
DELEGATION_MANAGER = "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
PAYMENT_ENFORCER = "0x07fA0aE59FdE4B7ce8962d6fE7a1d648ec3DD5CE"
DIGEST_BINDING_ENFORCER = "0xA3bb9BCC9b2F6F2419E1aBe5ED6Fd5399b9E68e1"
# The other three enforcers a payment mandate composes. All four are required to ASK a player to sign
# a buy-in mandate: a mandate assembled out of three would be a wider authority than the consent
# screen showed, so the route refuses by name rather than composing a partial one.
TIMESTAMP_ENFORCER = "0x73A7B878168b7DE48677617179A8bE894f0Dfe96"
ALLOWED_TARGETS_ENFORCER = "0x2156311097A936de1916a878bF53Bfd43c7b5715"
ALLOWED_METHODS_ENFORCER = "0xdBb2E47793393C499efB0f3fcbf6Ca8669791a41"
# Naming, for the OPTIONAL `<label>.treasury` a player may claim when they create a treasury. A
# treasury is allowed to be nameless and that is the default — the Smart Agent address is its id.
AGENT_NAME_REGISTRY = "0x60E949D52660A9D4143ecB0fdA56c0457f20aED9"
TREASURY_SUBREGISTRY = "0xf1df2D9b779C62a8BF5707C799d8E6842382892B"
# …and the resolver that answers "what address is `carol.me`?", so a host can put somebody on a club
# roster by the name they know them by instead of by a forty-character hex string.
AGENT_NAME_UNIVERSAL_RESOLVER = "0xF343054e046A4145ccae499ECB28197394eE0798"
# What a night's buy-in mandate may cover. These are the caps the player sees before signing and the
# ones the on-chain PaymentEnforcer holds: at most 200 chips (200 Sheqels at the chip rate above) per
# buy-in, five buy-ins, and twelve hours. A mandate is one night at a table, not a standing account.
#
# The MONEY ceiling is what a player consents to and it has NOT moved: 20 000 chips at the old
# 0.01 chip was the same 200. So a mandate signed under this line still covers a buy-in at an older
# table, whose chips are worth a hundredth as much.
#
# These are also the numbers the SIGN-IN screen shows before it sends anybody anywhere. Sign-in asks
# the player's Home for the `poker-buyin` template rather than `site-login`, so one visit brings back
# the session AND the mandate — which means signing in IS approving this ceiling, and the screen says
# so in these figures (GET /auth/config `home.buyIn`). A deployment that cannot state them (no
# HOUSE_DELEGATE, no enforcers) asks for a plain session and promises nothing about money.
MANDATE_MAX_BUY_IN_CHIPS = "200"
MANDATE_MAX_BUY_INS = "5"
MANDATE_VALID_SECONDS = "43200"
PAYMENT_RECEIPT_REGISTRY = "0x5FfDd6186C1bBc4628187B1c4C1fDaA39F870d43"
# Paymaster that sponsors the house's UserOps. It is in DEV MODE on faithchain (accepts every op)
# and holds a large EntryPoint deposit, so the house pays no gas of its own.
SMART_AGENT_PAYMASTER = "0xbd93fEC6910ffD74F14709188b5a9B6C6965b2a7"
# The house's own on-chain identity, provisioned by `pnpm provision:house`
# (scripts/provision-house.mts). Addresses also live in house.faithchain.json at the repo root;
# both accounts are mode-0 AgentAccounts custodied by ONE EOA whose key is the
# HOUSE_CUSTODIAN_KEY secret (see .dev.vars.example) — never a var, never in git.
#   service  — the Poker Site acting as an agent (A2A identity, receipts, future delegate).
#   treasury — the table bankroll. Buy-ins land here; cash-outs leave here.
HOUSE_SERVICE_SA = "0x0347e808a0bB7a7a7086a29d853E799f351C04DD"
HOUSE_TREASURY_SA = "0xf6F48aF1f645c70339b2FCF4CD36F5d6c5325671"
# Legacy alias kept for src/settlement.ts; identical to HOUSE_TREASURY_SA.
HOUSE_SA = "0xf6F48aF1f645c70339b2FCF4CD36F5d6c5325671"
# Phase 3: the delegate address players' poker-buyin delegations are scoped to. Not provisioned yet.
# The account that REDEEMS a buy-in mandate — and it must equal the mandate's delegate.
# A `pull` payment mandate names the PAYEE as its delegate (the Home's onboarding.ts:889:
# `mode === 'pull' ? payment.payee : OPEN_DELEGATION`), and the payee registered for this client is
# the house TREASURY. So the treasury redeems its own incoming buy-in, which is coherent: the money
# lands in the same account that spent the authority to collect it. Pointing this at the service
# agent instead made every mandate fail its delegate check with nothing wrong on the player's side.
HOUSE_DELEGATE = "0xf6F48aF1f645c70339b2FCF4CD36F5d6c5325671"
